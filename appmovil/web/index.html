<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si sirves la app desde una subcarpeta, `flutter build web --base-href /ruta/`
    reemplaza este valor.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="DonTramite, asistente estudiantil para consultar tramites.">
  <meta name="theme-color" content="#2F7FBB">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DonTramite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DonTramite</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F5F8FB; }

    /* Pantalla de carga: evita el rectangulo blanco mientras arranca Flutter. */
    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F5F8FB;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      z-index: 10;
      transition: opacity .25s ease;
    }
    #cargando.oculto { opacity: 0; pointer-events: none; }
    #cargando img {
      width: 96px; height: 96px;
      border-radius: 24px;
      border: 4px solid #FFC20E;
      background: #fff;
      object-fit: cover;
    }
    #cargando strong {
      font-size: 22px;
      font-weight: 800;
      color: #111111;
      letter-spacing: -.02em;
    }
    #cargando span {
      width: 26px; height: 26px;
      border: 3px solid #DCE3EA;
      border-top-color: #2F7FBB;
      border-radius: 50%;
      animation: girar .9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #cargando span { animation: none; } }
  </style>
</head>
<body>
  <div id="cargando">
    <img src="icons/Icon-192.png" alt="DonTramite">
    <strong>DonTramite</strong>
    <span role="progressbar" aria-label="Cargando"></span>
  </div>

  <script>
    // Flutter dispara este evento cuando pinta el primer fotograma.
    window.addEventListener('flutter-first-frame', function () {
      var capa = document.getElementById('cargando');
      if (!capa) return;
      capa.classList.add('oculto');
      setTimeout(function () { capa.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
