org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --------------------------------------------------------------------------
# Compilacion incremental de Kotlin desactivada: obligatorio en esta maquina.
#
# El proyecto vive en D:\SistemaRAG y la cache de paquetes de Dart en
# C:\Users\elber\AppData\Local\Pub\Cache. Cuando un plugin trae codigo Kotlin
# (shared_preferences_android, por ejemplo), la cache incremental de Kotlin
# intenta guardar la ruta del fuente *relativa* a la carpeta del proyecto:
#
#   RelocatableFileToPathConverter -> File.relativeTo(base)
#
# En Windows eso revienta si los dos caminos estan en unidades distintas:
#   "this and base files have different roots: C:\...\plugin.kt y D:\...\android"
#
# Sin compilacion incremental no se escriben esas caches y el problema
# desaparece. Solo afecta a la velocidad de recompilar codigo Kotlin de los
# plugins, que practicamente nunca cambia: el codigo Dart sigue con hot reload.
#
# Alternativa si prefieres recuperar la compilacion incremental: mueve la cache
# de paquetes a la misma unidad que el proyecto, con la variable de entorno
#   PUB_CACHE=D:\pub-cache
# y vuelve a ejecutar `flutter pub get`.
# --------------------------------------------------------------------------
kotlin.incremental=false
kotlin.incremental.android=false
